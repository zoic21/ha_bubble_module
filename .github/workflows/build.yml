name: Build module distributions

on:
  push:
    branches:
      - '**'
    paths:
      - '**/src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, validate and commit YAML
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Generate, validate and publish distributions
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: bash scripts/build-and-commit.sh
