name: Module tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test modules and documentation
        run: |
          npm run build:modules
          npm run check:modules
          npm test

  styles:
    name: Computed styles (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build modules from the tested sources
        run: npm run build:modules
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fetch pinned Bubble source for native Panel fixtures
        run: curl --fail --location --retry 2 --output "$RUNNER_TEMP/bubble-native.js" https://raw.githubusercontent.com/Clooos/Bubble-Card/061ed8376134307ba1086446869d0ab736265fcf/dist/bubble-card.js
      - name: Check computed styles
        env:
          BUBBLE_VARIANTS_NATIVE_SCRIPT_PATH: ${{ runner.temp }}/bubble-native.js
          PANEL_CAPTURE_DIR: ${{ runner.temp }}/panel-captures
        run: npm run test:styles
      - name: Upload Panel layout captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-layouts
          path: ${{ runner.temp }}/panel-captures
          if-no-files-found: ignore
