# Replace the five Energy/Water cards with this one card. Keep the section title.
# Import dist/signature-flow.yaml as a module first; this file is the card config.
type: custom:bubble-card
card_type: button
button_type: state
entity: sensor.puissance_maison
name: Énergie & eau
card_layout: large
grid_options:
  columns: 12
  rows: 5
modules:
  - signature_flow
signature_flow:
  height: 310
  animation:
    speed: 24
    max_arrows: 5
    reference: 10000
  slots:
    1:
      icon: mdi:white-balance-sunny
      color: "#ff9800"
      primary: sensor.puissance_solaire_total
      name: Solaire
      secondary: >-
        {% set id = 'sensor.solcast_pv_forecast_previsions_de_production_restantes_aujourd_hui' %}
        {% set value = states(id) %}
        {% set unit = state_attr(id, 'unit_of_measurement') %}
        {{ 'Reste ' ~ (((value | float / (1000 if unit == 'Wh' else 1)) | round(1) | string).replace('.', ',')) ~ ' kWh'
           if is_number(value) and unit in ['Wh', 'kWh'] else 'Prévision indisponible' }}
      tap_action:
        action: navigate
        navigation_path: '#production-details'
    2:
      icon: mdi:transmission-tower
      color: "#00b8cf"
      primary: sensor.infra_reseaux_puissance
      name: Réseau
      secondary: ''
      tap_action:
        action: navigate
        navigation_path: '#reseaux-details'
    3:
      primary: sensor.zendure_manager_power
      color: '#009c90'
      icon: >-
        {{ 'mdi:battery-charging' if states('sensor.zendure_manager_power') | float(0) < 0 else 'mdi:battery' }}
      secondary: "{{ states('sensor.zendure_manager_global_soc') | int }} %"
      name: Batterie
      primary_unit: W
      tap_action:
        action: navigate
        navigation_path: '#batterie-details'
    5:
      icon: mdi:home-outline
      primary: sensor.puissance_maison
      name: Maison
      tap_action:
        action: navigate
        navigation_path: '#consumption-details'
    6:
      primary: sensor.debit_eau
      name: Eau
      icon: mdi:water-outline
      color: '#6ab5f4'
      primary_scale: 1000
      primary_unit: L/min
      primary_precision: 1
      animation:
        reference: 20
      tap_action:
        action: navigate
        navigation_path: '#water-details'
