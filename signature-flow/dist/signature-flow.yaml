        '.sf-node{position:absolute;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;min-height:76px;padding:2px 0;border-radius:16px;background:var(--sf-surface);text-align:left;line-height:1.2;cursor:pointer}.sf-node[hidden]{display:none}.sf-content{display:grid;grid-template-rows:max(17px,calc(var(--signature-name-font-size,14px)*1.2)) max(34px,calc(var(--signature-value-font-size,28px)*1.2)) max(16px,calc(var(--signature-secondary-font-size,13px)*1.2));gap:2px;min-width:0;align-items:start}.sf-label{font-size:var(--signature-name-font-size,14px);font-weight:var(--signature-font-weight-semibold, 600);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sf-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--signature-icon-border-radius,12px);color:var(--sf-color);background:color-mix(in srgb,var(--sf-color) 16%,var(--sf-surface))}.sf-icon ha-icon{--mdc-icon-size:22px}.sf-value{font-size:var(--signature-value-font-size,28px);font-weight:var(--signature-font-weight-medium, 500);letter-spacing:-.7px;white-space:nowrap;line-height:max(34px,calc(var(--signature-value-font-size,28px)*1.2));font-variant-numeric:tabular-nums;border-radius:6px}.sf-unit{font-size:var(--signature-value-unit-font-size,16px);font-weight:var(--signature-font-weight-normal, 400);letter-spacing:0;color:var(--secondary-text-color)}.sf-secondary{font-size:var(--signature-secondary-font-size,13px);white-space:nowrap;color:var(--secondary-text-color);pointer-events:none}.sf-secondary.sf-detail{pointer-events:auto;cursor:pointer;border-radius:4px}.sf-node:focus,.sf-value:focus,.sf-detail:focus{outline:none}.sf-canvas[data-sf-keyboard] .sf-node:focus-visible,.sf-canvas[data-sf-keyboard] .sf-value:focus-visible,.sf-canvas[data-sf-keyboard] .sf-detail:focus-visible{outline:2px solid var(--sf-color);outline-offset:3px}\n'+
        '.sf-slot-1{width:180px;top:0;left:calc(50% - 90px)}.sf-slot-2{background:transparent;width:min(170px,calc(50% - 20px));top:calc(50% - 42px);left:0}.sf-slot-5{width:140px;top:calc(50% - 42px);right:0}.sf-slot-3{width:180px;bottom:0;left:calc(50% - 90px)}.sf-slot-4,.sf-slot-6{width:140px;right:0}.sf-slot-4{top:0}.sf-slot-6{bottom:0}.sf-slot-4 .sf-value,.sf-slot-6 .sf-value{font-size:max(16px,calc(var(--signature-value-font-size,28px) - 4px))}.sf-slot-4 .sf-unit,.sf-slot-6 .sf-unit{font-size:var(--signature-secondary-font-size,13px)}.sf-narrow .sf-slot-1,.sf-narrow .sf-slot-3{background:transparent;left:0;width:min(170px,calc(50% - 20px))}.sf-has-4 .sf-slot-1{left:0}\n'+
        '.sf-small .sf-node{grid-template-columns:28px minmax(0,1fr);gap:8px}.sf-small .sf-icon{width:28px;height:28px;border-radius:var(--signature-icon-small-border-radius,max(0px,calc(var(--signature-icon-border-radius,12px) - 2px)))}.sf-small .sf-icon ha-icon{--mdc-icon-size:20px}.sf-small .sf-slot-5{width:112px}.sf-small .sf-slot-3,.sf-small .sf-slot-1{width:min(140px,calc(50% - 20px))}.sf-small .sf-slot-3 .sf-secondary{margin-left:-36px}.sf-small .sf-value{font-size:max(18px,calc(var(--signature-value-font-size,28px) - 2px))}.sf-small .sf-slot-4,.sf-small .sf-slot-6{width:112px}.sf-small .sf-slot-4 .sf-value,.sf-small .sf-slot-6 .sf-value{font-size:max(16px,calc(var(--signature-value-font-size,28px) - 8px))}.sf-small .sf-slot-4 .sf-unit,.sf-small .sf-slot-6 .sf-unit{font-size:var(--signature-caption-font-size,12px)}\n'+
