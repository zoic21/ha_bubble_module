name: Signature
version: 2.3.4
creator: Loïc
supported:
  - button
  - cover
  - climate
  - separator
  - media-player
description: "Configuration dans l’éditeur Bubble en français ou en YAML. Cinq layouts : compacte, carrée, pièce, en-tête et titre de section. Le layout title habille les séparateurs natifs sans trait horizontal. Les actions et sub_button restent natifs. Fond neutre par défaut, couleur sur l’icône et son fond pastel ; color_background: true teinte aussi la carte et accepte Jinja. Les lecteurs multimédias suivent ce choix sans modifier leurs commandes natives. Square accepte auto_height: true pour adapter sa hauteur au contenu, avec multiline: true pour les textes longs. Police système, noms compact/square à 14 px, sous-textes compact/square à 13 px, valeurs compactes à 20 px et square à 28 px et espacements compacts communs à tous les écrans. Les popups et sliders restent hors du module."
editor:
  - type: constant
    label: L’entité principale, les actions et les sous-boutons se configurent dans les réglages natifs de Bubble.
  - name: ""
    label: Réglages adaptés à la carte
    type: signature_options
    fields:
      layout:
        label: Présentation
        default: compact
        selector:
          select:
            mode: dropdown
            options:
              - label: Compacte
                value: compact
              - label: Carrée
                value: square
              - label: Pièce
                value: room
              - label: En-tête
                value: header
              - label: Titre de section
                value: title
        visible_if: "!card || (card.card_type === 'separator') || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)) || ['title','heading'].includes(item.layout)"
        warn_if: card && item.layout && ((!['compact','square','room','header','title'].includes(item.layout)) || (item.layout === 'title' && card.card_type !== 'separator') || (card.card_type === 'separator' && item.layout !== 'title') || (item.layout === 'header' && ((card.card_type || 'button') !== 'button' || card.button_type !== 'name')) || (['square','room'].includes(item.layout) && ((card.card_type || 'button') !== 'button' || ['switch','slider'].includes(card.button_type))))
        warn_text: "Cette présentation est incompatible avec le type de carte : titre pour un séparateur, en-tête pour un bouton de nom ; les volets, thermostats et interrupteurs restent compacts."
      color:
        label: Couleur de l’icône
        default: blue
        selector:
          select:
            mode: dropdown
            custom_value: true
            options:
              - label: Bleu
                value: blue
              - label: Bleu clair
                value: light-blue
              - label: Turquoise
                value: teal
              - label: Cyan
                value: cyan
              - label: Vert
                value: green
              - label: Orange
                value: orange
              - label: Ambre
                value: amber
              - label: Jaune
                value: yellow
              - label: Rouge
                value: red
              - label: Rose
                value: pink
              - label: Indigo
                value: indigo
              - label: Violet
                value: purple
              - label: Gris
                value: grey
        visible_if: "!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button')))"
        description: Couleur de la palette, couleur CSS ou template Jinja.
      secondary:
        label: Texte secondaire (entité, texte ou template)
        default: ""
        selector:
          text:
            multiline: true
        visible_if: (!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))) && !(item.layout === 'header' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (!card || card.button_type === 'name'))
      compact_mode:
        label: Valeur compacte
        default: default
        selector:
          select:
            mode: dropdown
            options:
              - label: Affichage standard
                value: default
              - label: Valeur à droite
                value: value
        group: Valeurs et textes
        group_icon: mdi:format-text
        visible_if: ((!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))) && (!['square','room','header'].includes(item.layout) || (card && (['cover','climate'].includes(card.card_type) || card.button_type === 'switch' || (item.layout === 'header' && card.button_type !== 'name'))))) && (!card || (card.card_type || 'button') === 'button') && (!card || card.button_type === 'state' || (card.button_type === 'name' && String(item.state || '').trim() !== ''))
      state:
        label: Valeur principale personnalisée (texte ou template)
        default: ""
        selector:
          text:
            multiline: true
        group: Valeurs et textes
        group_icon: mdi:format-text
        visible_if: (!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))) && !(item.layout === 'header' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (!card || card.button_type === 'name'))
      secondary_bold:
        label: Interpréter **texte** en gras dans le texte secondaire
        default: false
        selector:
          boolean: {}
        group: Valeurs et textes
        group_icon: mdi:format-text
        visible_if: ((!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))) && !(item.layout === 'header' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (!card || card.button_type === 'name'))) && String(item.secondary || '').trim() !== ''
      multiline:
        label: Autoriser les textes sur plusieurs lignes
        default: false
        selector:
          boolean: {}
        group: Valeurs et textes
        group_icon: mdi:format-text
        visible_if: (!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))) && !(item.layout === 'header' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (!card || card.button_type === 'name'))
      controls:
        label: Commandes
        default: native
        selector:
          select:
            mode: dropdown
            options:
              - label: Commandes natives
                value: native
              - label: Numériques (− / valeur / +)
                value: number
              - label: Mesure (commande et détail)
                value: measure
        group: Commandes et sous-boutons
        group_icon: mdi:gesture-tap-button
        visible_if: (item.layout === 'square' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))) || (((!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))) && (!['square','room','header'].includes(item.layout) || (card && (['cover','climate'].includes(card.card_type) || card.button_type === 'switch' || (item.layout === 'header' && card.button_type !== 'name'))))) && (!card || (card.card_type || 'button') === 'button') && (!card || (card.button_type === 'state' && ['number','input_number'].includes((card.entity || '').split('.')[0]))))
        warn_if: (item.controls === 'number' && !(((!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))) && (!['square','room','header'].includes(item.layout) || (card && (['cover','climate'].includes(card.card_type) || card.button_type === 'switch' || (item.layout === 'header' && card.button_type !== 'name'))))) && (!card || (card.card_type || 'button') === 'button') && (!card || (card.button_type === 'state' && ['number','input_number'].includes((card.entity || '').split('.')[0]))))) || (item.controls === 'measure' && !(item.layout === 'square' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))))
        warn_text: "Numériques : bouton number/input_number en compacte. Mesure : tuile carrée avec les sous-boutons natifs."
      sub_buttons_position:
        label: Position des sous-boutons en compacte
        default: default
        selector:
          select:
            mode: dropdown
            options:
              - label: Position standard
                value: default
              - label: Après les commandes natives
                value: end
        group: Commandes et sous-boutons
        group_icon: mdi:gesture-tap-button
        visible_if: (!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))) && (!['square','room','header'].includes(item.layout) || (card && (['cover','climate'].includes(card.card_type) || card.button_type === 'switch' || (item.layout === 'header' && card.button_type !== 'name'))))
      sub_button_styles:
        label: Styles des sous-boutons (objet YAML)
        default: {}
        selector:
          object: {}
        group: Commandes et sous-boutons
        group_icon: mdi:gesture-tap-button
        visible_if: "!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))"
        description: Objet YAML indexé par css_class ou numéro de sous-bouton ; les clés personnalisées restent compatibles.
      auto_height:
        label: Adapter la hauteur au contenu
        default: false
        selector:
          boolean: {}
        group: Tuile carrée
        group_icon: mdi:card-outline
        visible_if: item.layout === 'square' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      reserve_measure_detail:
        label: Réserver la ligne de détail avec les commandes de mesure
        default: false
        selector:
          boolean: {}
        group: Tuile carrée
        group_icon: mdi:card-outline
        visible_if: (item.layout === 'square' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))) && item.controls === 'measure'
      room_auto_colors:
        label: Coloration automatique des commandes (booléen YAML)
        default: true
        selector:
          object: {}
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: item.layout === 'room' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
        description: true par défaut ; false désactive les couleurs automatiques.
      room_control_columns:
        label: Colonnes de commandes
        default: 4
        selector:
          number:
            mode: box
            min: 1
            max: 6
            step: 1
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: item.layout === 'room' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
        description: 4 colonnes par défaut, de 1 à 6.
      room_measures_position:
        label: Position des mesures
        default: content
        selector:
          select:
            mode: dropdown
            options:
              - label: Dans le contenu
                value: content
              - label: Dans l’en-tête
                value: header
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: (item.layout === 'room' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))) && String(item.secondary || '').trim() === '' && (!card || card.show_state === false || (card.show_state !== true && card.button_type === 'name' && String(item.state || '').trim() === ''))
      color_background:
        label: Colorer aussi le fond (booléen ou template YAML)
        default: false
        selector:
          object: {}
        group: Apparence avancée
        group_icon: mdi:palette-outline
        visible_if: (!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button')))) && !(item.layout === 'header' && (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (!card || card.button_type === 'name'))
        description: false par défaut. Saisir true/false ou un template Jinja entre guillemets.
      icon_color:
        label: Couleur personnalisée de l’icône
        default: ""
        selector:
          text: {}
        group: Apparence avancée
        group_icon: mdi:palette-outline
        visible_if: "!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))"
      icon_opacity:
        label: Opacité de l’icône (nombre ou template YAML)
        default: null
        selector:
          object: {}
        group: Apparence avancée
        group_icon: mdi:palette-outline
        visible_if: "!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))"
        description: Opacité native par défaut. Saisir de 0 à 1, null ou un template Jinja entre guillemets.
      border_color:
        label: Couleur de la bordure de la carte
        default: ""
        selector:
          text: {}
        group: Apparence avancée
        group_icon: mdi:palette-outline
        visible_if: "!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))"
      icon_border_color:
        label: Couleur de la bordure du fond de l’icône
        default: ""
        selector:
          text: {}
        group: Apparence avancée
        group_icon: mdi:palette-outline
        visible_if: "!['title','heading'].includes(item.layout) && (!card || (card.button_type !== 'slider' && ['button','cover','climate'].includes(card.card_type || 'button')))"
