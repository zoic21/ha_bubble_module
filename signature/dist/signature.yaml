# Compact value : la valeur native reste après les sous-boutons, unité séparée conservée.
# Header/title : seules les couleurs et l’opacité des sous-boutons sont animées.
# Compact : controls: number ajoute − / valeur et unité / + pour number et input_number.
# Lock : type: switch avec lock.lock/unlock explicites ; ON = unlocked.
# Secondary : entité directe, template ou texte ; cible more-info détectée et mise en cache.
# Option secondary_bold: true : **texte** en gras dans secondary uniquement.
# Compact value : mesures à 20px, unités à 13px, textes à 16px ; retrait commun de 6px à droite.
# Option square : auto_height: true adapte la hauteur au contenu.
# Associer multiline: true pour les sous-titres sur plusieurs lignes.
# Sans auto_height, les layouts existants conservent leur hauteur habituelle.
# Compact : sub_buttons_position: end place les sous-boutons après les commandes natives.
# Les sous-boutons humidifier acceptent type: switch dans sub_button_styles.
# Compact : type: mode dans sub_button_styles habille les boutons de mode en 46 × 44 px.
# Compact : groupe de commandes volet de 128 px, aligné sur la consigne thermostat.
# Durées calculées h/min : chiffres conservés, unités plus petites et grises.
# Compact : padding vertical des noms pour préserver accents et jambages.
# Room : room_control_columns répartit les commandes ; trait au-dessus de toutes les rangées.
# Room : room_measures_position: header garde deux rangées de commandes dans 156px.
# Room : ripple circulaire pour les commandes sans libellé.
# Measure : reserve_measure_detail aligne les secondaires avec ou sans détail EC.
# Compact value : états calculés des boutons name et durées h/min pris en charge.
# Couleur limitée à l’icône par défaut ; color_background: true teinte aussi la carte.
# color_background accepte un booléen ou un template Jinja renvoyant true/false.
# Style 1.8.5 : icônes compact/square de 36px, retrait de 10px et arrondis concentriques.
# Room : température agrandie, humidité grise à droite, commandes sous un trait discret.
# Livraison 1.8.5 : rendu et commandes dans HA à confirmer.
signature:
  name: Signature
  version: 2.2.1
  creator: Loïc
  supported:
    - button
    - cover
    - climate
    - separator
    - media-player
  description: 'Cinq layouts : compacte, carrée, pièce, en-tête et titre de section. Le layout title habille les séparateurs natifs sans trait horizontal. Les actions et sub_button restent natifs. Fond neutre par défaut, couleur sur l’icône et son fond pastel ; color_background: true teinte aussi la carte et accepte Jinja. Les lecteurs multimédias suivent ce choix sans modifier leurs commandes natives. Square accepte auto_height: true pour adapter sa hauteur au contenu, avec multiline: true pour les textes longs. Police système, noms compact/square à 14 px, sous-textes compact/square à 13 px, valeurs compactes à 20 px et square à 28 px et espacements compacts communs à tous les écrans. Les popups et sliders restent hors du module.'
