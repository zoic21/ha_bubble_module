name: Signature Compact
version: 1.6.3
creator: Loïc
supported:
  - button
  - cover
  - climate
  - media-player
description: Module autonome compact ; réglages en français, variables CSS du thème Signature et actions Bubble natives. Utiliser un seul module de présentation par carte.
editor:
  - type: constant
    label: L’entité principale, les actions et les sous-boutons se configurent dans les réglages natifs de Bubble.
  - name: ""
    label: Réglages compact
    type: signature_options
    fields:
      color:
        $field: color
        visible_if: (!card || card.card_type === 'media-player' || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      secondary:
        $field: secondary
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      compact_mode:
        label: Valeur compacte
        default: default
        selector:
          select:
            mode: dropdown
            options:
              - label: Affichage standard
                value: default
              - label: Valeur à droite
                value: value
        group: Valeurs et textes
        group_icon: mdi:format-text
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider')) && (!card || ((card.card_type || 'button') === 'button' && (card.button_type === 'state' || (card.button_type === 'name' && String(item.state || '').trim() !== ''))))
      value_style:
        label: Présentation de la valeur
        default: text
        selector:
          select:
            mode: dropdown
            options:
              - label: Grande valeur
                value: text
              - label: Petit bouton avant les commandes
                value: button
        group: Valeurs et textes
        group_icon: mdi:format-text
        description: "Bouton de 36 px, valeur de 14 px et unité de 12 px. Les interrupteurs visuels restent en dernier dans leur groupe natif."
        visible_if: item.compact_mode === 'value' && item.controls !== 'number' && (!card || ((card.card_type || 'button') === 'button' && (card.button_type === 'state' || (card.button_type === 'name' && String(item.state || '').trim() !== ''))))
      value_background:
        label: Fond du petit bouton de valeur
        default: true
        selector:
          boolean: {}
        group: Valeurs et textes
        group_icon: mdi:format-text
        description: "Désactiver pour afficher la petite valeur sans pastille, toujours cliquable avant les commandes."
        visible_if: item.compact_mode === 'value' && item.value_style === 'button' && item.controls !== 'number' && (!card || ((card.card_type || 'button') === 'button' && (card.button_type === 'state' || (card.button_type === 'name' && String(item.state || '').trim() !== ''))))
      state:
        $field: state
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      name_lines:
        label: Lignes du nom en mode valeur
        default: 1
        selector:
          number:
            min: 1
            max: 2
            step: 1
            mode: box
        group: Valeurs et textes
        group_icon: mdi:format-text
        description: Deux lignes au maximum, avec une hauteur qui suit la taille de police du thème.
        visible_if: item.compact_mode === 'value' && (!card || ((card.card_type || 'button') === 'button' && (card.button_type === 'state' || (card.button_type === 'name' && String(item.state || '').trim() !== ''))))
      fill:
        label: Remplissage proportionnel (objet YAML)
        default: {}
        selector:
          object: {}
        group: Remplissage proportionnel
        group_icon: mdi:chart-bar
        description: "reference_entity : entité du total, ou max : limite fixe dans l’unité principale. Fond doux à 16 %, enabled: false désactive. Une donnée invalide masque la jauge."
        visible_if: (!card || ((card.card_type || 'button') === 'button' && card.button_type === 'state' && item.controls !== 'number'))
      secondary_bold:
        $field: secondary_bold
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider')) && (String(item.secondary || '').trim() !== '')
      multiline:
        $field: multiline
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      controls:
        label: Commandes
        default: native
        selector:
          select:
            mode: dropdown
            options:
              - label: Commandes natives
                value: native
              - label: Numériques (− / valeur / +)
                value: number
        group: Commandes et sous-boutons
        group_icon: mdi:gesture-tap-button
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider')) && (!card || ((card.card_type || 'button') === 'button' && card.button_type === 'state' && ['number','input_number'].includes((card.entity || '').split('.')[0])))
        warn_text: "Numériques : bouton number/input_number en compacte. Mesure : tuile carrée avec les sous-boutons natifs."
        warn_if: item.controls === 'number' && !(!card || ((card.card_type || 'button') === 'button' && card.button_type === 'state' && ['number','input_number'].includes((card.entity || '').split('.')[0])))
        warn_message: Les commandes numériques nécessitent un bouton État lié à number ou input_number.
      sub_buttons_position:
        label: Position des sous-boutons en compacte
        default: default
        selector:
          select:
            mode: dropdown
            options:
              - label: Position standard
                value: default
              - label: Après les commandes natives
                value: end
        group: Commandes et sous-boutons
        group_icon: mdi:gesture-tap-button
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      sub_button_styles:
        $field: sub_button_styles
        description: "Styles par classe ou numéro natif. type: mode_badge superpose une unique commande Auto/Manuel nommée à l’icône d’une carte cover/climate : badge de 14 px et cible native de 44 px ; color/background restent configurables."
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      color_background:
        $field: color_background
        visible_if: (!card || card.card_type === 'media-player' || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      icon_color:
        $field: icon_color
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      color_thresholds:
        $field: color_thresholds
        visible_if: (!card || ((card.card_type || 'button') === 'button' && card.button_type !== 'slider'))
      icon_opacity:
        $field: icon_opacity
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      border_color:
        $field: border_color
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
      icon_border_color:
        $field: icon_border_color
        visible_if: (!card || (['button','cover','climate'].includes(card.card_type || 'button') && card.button_type !== 'slider'))
