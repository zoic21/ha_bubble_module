name: Signature Hue
version: 1.2.0
creator: Loïc
supported:
  - button
  - pop-up
description: Présentation commune des popups Hue, en complément de Signature Compact. Les entités, actions, conditions natives et templates
  de sélection restent dans la carte. Aucun contrôle Hue, abonnement ou observateur ajouté.
editor:
  - name: ""
    label: Présentation Hue
    type: signature_guided_v1
    fields:
      mode:
        label: Présentation
        selector:
          select:
            options:
              - label: Lampe individuelle
                value: light
              - label: Aperçu de scène
                value: scene
              - label: Ligne de luminosité
                value: brightness
              - label: Interrupteur d’animation
                value: animation
              - label: Popup
                value: popup
      available:
        label: Disponible (booléen ou Jinja)
        selector:
          text: {}
        description: "Défaut : true. Une expression non résolue ne réactive pas une commande."
        ui_kind: bool
        visible_if: '["light","scene","brightness"].includes(item.mode) && item.status == null'
      selected:
        label: Scène sélectionnée (booléen ou Jinja)
        selector:
          text: {}
        ui_kind: bool
        visible_if: item.mode === "scene" && item.status == null
      palette:
        label: Couleurs de l’aperçu
        selector:
          text: {}
        description: "Trois couleurs #RRGGBB séparées par des virgules, ou un template Jinja. Ne commande pas les lampes."
        ui_kind: palette
        visible_if: item.mode === "scene"
      status:
        label: Disponibilité et sélection partagées (JSON ou Jinja)
        selector:
          text: {}
        description: "Optionnel : objet JSON avec available et selected. Prioritaire sur les deux champs séparés ; permet un seul template HA."
        ui_kind: json
        visible_if: '["light","scene","brightness"].includes(item.mode)'
        group: Conditions partagées (avancé)
