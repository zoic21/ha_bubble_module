signature_reactions:
 name: Signature Reactions
 version: 1.1.0
 creator: Loïc
 supported: [button, select, cover, climate, media-player, separator, sub-buttons]
 description: Réactions de l’interface aux templates Jinja, événements et périodes d’inactivité. Actions natives HA, ciblage utilisateur, délais et retours. Aucun élément visuel. Bubble Card 3.4.3 ou plus récent.
 editor: [{type: constant, label: Ajouter à une carte existante sur chaque vue concernée. Les copies des mêmes règles partagent automatiquement leurs abonnements et délais. Les actions s’exécutent dans chaque session ciblée.}, {name: "", label: Réactions de l’interface, type: signature_reactions_options_v1, fields: {users: {label: Utilisateurs concernés, description: Liste vide = tous. Les comptes exclus n’ouvrent aucun abonnement et ne suivent aucune entité ou interaction., selector: {select: {multiple: true, custom_value: true, options: []}}}, rules: {label: Règles, selector: {bc_object: {multiple: true, label_field: trigger, description_field: [entity, event_type, template], fields: {trigger: {label: Déclencheur, selector: {select: {options: [{label: Template Jinja devenant vrai, value: template}, {label: Événement, value: event}, {label: Inactivité de l’interface, value: idle}]}}}, template: {label: Condition Jinja, description: "Déclenche au passage faux → vrai. Le serveur suit les dépendances, sans interrogation périodique du navigateur.", visible_if: item.trigger === 'template', selector: {template: {}}}, __event_source: {label: Source de l’événement, visible_if: item.trigger === 'event', selector: {select: {options: [{label: Entité événement ou relais, value: entity}, {label: Événement HA (administrateur), value: bus}]}}}, entity: {label: Entité événement ou relais, description: "Une nouvelle occurrence relance le délai, même si son type est identique.", visible_if: item.trigger === 'event' && item.__event_source !== 'bus', selector: {entity: {}}}, event_type: {label: Nom de l’événement HA, description: "Réservé aux administrateurs. Pour un autre compte, choisir une entité événement ou le relais Template.", visible_if: item.trigger === 'event' && item.__event_source === 'bus', selector: {text: {}}}, seconds: {label: Secondes sans interaction, visible_if: item.trigger === 'idle', selector: {number: {min: 1, max: 86400, mode: box, unit_of_measurement: s}}}, ac