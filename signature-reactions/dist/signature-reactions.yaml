signature_reactions:
 name: Signature Reactions
 version: 2.1.0
 creator: Loïc
 supported: [button, select, cover, climate, media-player, separator, sub-buttons]
 description: Réactions de l’interface aux templates Jinja, événements du bus HA pour les administrateurs et périodes d’inactivité. Actions natives HA, ciblage utilisateur, délais et retours. Aucun élément visuel. Bubble Card 3.4.3 ou plus récent.
 editor: [{type: constant, label: Ajouter à une carte existante sur chaque vue concernée. Les copies des mêmes règles partagent automatiquement leurs abonnements et délais. Les actions s’exécutent dans chaque session ciblée.}, {name: "", label: Réactions de l’interface, type: signature_reactions_options_v1, fields: {users: {label: Utilisateurs concernés, description: Liste vide = tous. Les comptes exclus n’ouvrent aucun abonnement et ne suivent aucune entité ou interaction., selector: {select: {multiple: true, custom_value: true, options: []}}}, rules: {label: Règles, selector: {bc_object: {multiple: true, label_field: trigger, description_field: [event_type, template], fields: {trigger: {label: Déclencheur, selector: {select: {options: [{label: Template Jinja, value: template}, {label: Événement HA (administrateur), value: event}, {label: Inactivité de l’interface, value: idle}]}}}, template: {label: Expression Jinja, description: Déclenche au passage faux → vrai par défaut. Le serveur suit les dépendances du template., visible_if: item.trigger === 'template', selector: {template: {}}}, on_change: {label: Déclencher à chaque nouvelle valeur, description: "Pour un texte ou un nombre, par exemple l’horodatage d’une sonnerie.", visible_if: item.trigger === 'template', selector: {boolean: {}}}, event_type: {label: Nom de l’événement HA, description: "Réservé aux comptes administrateurs. Pour un autre compte, utiliser une condition Jinja.", visible_if: item.trigger === 'event', selector: {text: {}}}, seconds: {label: Secondes sans interaction, visible_if: item.trigger === 'idle', selector: {number: {min: 1, max: 86400, mode: box, unit_of_measurement: s}}}, action: {label: Action à exécuter, selector: {ui_action: {default_action: none}}}, delay: {label: Délai avant l’action (secondes), description: Une nouvelle occurrence relance ce délai. Un résultat faux ou vide selon le mode du template l’annule., group: Temporisations et retour, selector: {number: {min: 0, max: 86400