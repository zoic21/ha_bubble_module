# Add the same signature_reactions configuration to an existing, unprotected
# Bubble card on every participating view, including the doorbell view.
# Requires an administrator account for HA bus events.
# Replace TABLET_USER_ID with its HA account ID and adapt the paths.
# Emit the action from event.yaml whenever the doorbell rings.
modules:
  - signature_navigation
  - signature_reactions
signature_reactions:
  users: [TABLET_USER_ID]
  rules:
    - trigger: event
      event_type: signature_reaction
      event_data: {name: doorbell}
      action:
        action: navigate
        navigation_path: /lovelace/sonnette
      return_after: 60
      return_action:
        action: navigate
        navigation_path: /lovelace/summary-home
        navigation_replace: true
    - trigger: idle
      seconds: 300
      action:
        action: navigate
        navigation_path: /lovelace/summary-home
        navigation_replace: true
