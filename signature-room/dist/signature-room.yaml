signature_room:
 name: Signature Room
 version: 1.3.7
 creator: Loïc
 supported: [button]
 description: Module autonome room ; réglages en français, variables CSS du thème Signature et actions Bubble natives. Utiliser un seul module de présentation par carte.
 editor: [{type: constant, label: "L’entité principale, les actions et les sous-boutons se configurent dans les réglages natifs de Bubble."}, {name: "", label: Réglages room, type: signature_options, fields: {room_mode: {label: Présentation de la pièce, default: classic, selector: {select: {mode: dropdown, options: [{label: Classique, value: classic}, {label: Illustrée, value: illustrated}]}}, group: Pièce, group_icon: mdi:sofa-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))", description: "Illustrée : 148 px, nom et température, dessin à droite centré au-dessus des commandes ; humidité et icône principale masquées. Commandes et badges natifs conservés."}, illustration: {label: Illustration de la pièce (objet YAML), default: {}, selector: {object: {}}, group: Pièce, group_icon: mdi:sofa-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (item.room_mode === 'illustrated')", description: "image : URL locale/HTTPS ; image_light/image_dark : variantes facultatives HA ; columns/rows : grille de sprites ; index : case à partir de 0, nombre ou Jinja ; offset_x/offset_y : nombre ou Jinja, cadrage en % de case de −50 à 50. Images à installer séparément."}, color: {label: Couleur de l’icône, default: blue, selector: {select: {mode: dropdown, custom_value: true, options: [{label: Bleu, value: blue}, {label: Bleu clair, value: light-blue}, {label: Turquoise, value: teal}, {label: Cyan, value: cyan}, {label: Vert, value: green}, {label: Orange, value: orange}, {label: Ambre, value: amber}, {label: Jaune, value: yellow}, {label: Rouge, value: red}, {label: Rose, value: pink}, {label: Indigo, value: indigo}, {label: Violet, value: purple}, {label: Gris, value: grey}]}}, description: "Couleur de la palette, couleur CSS ou template Jinja.", visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, secondary: {label: "Texte secondaire (entité, texte ou template)", default: "", selector: {text: {multiline: true}}, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, state: {label: Valeur principale personnalisée (texte ou template), default: "", selector: {text: {multiline: true}}, group: Valeurs et textes, group_icon: mdi:format-text, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, room_state_as_value: {label: État principal en grande valeur, default: false, selector: {boolean: {}}, group: Pièce, group_icon: mdi:sofa-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))", description: Valeur numérique et unité selon le rôle de mesure ; état textuel de 22 px. Ne modifie pas les actions natives.}, room_state_centered: {label: Centrer l’état entre le nom et les commandes, default: false, selector: {boolean: {}}, group: Pièce, group_icon: mdi:sofa-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (item.room_mode === 'illustrated') && (String(item.secondary || '').trim() === '')", description: "En mode illustré sans secondaire, centre l’état dans l’espace réel entre le titre et les commandes visibles. Aucun effet sans commandes."}, room_inline_metrics: {label: Aligner les mesures avec la valeur principale, default: false, selector: {boolean: {}}, group: Pièce, group_icon: mdi:sofa-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (item.room_mode === 'illustrated')", description: "Place la valeur principale et 1 ou 2 sous-boutons room-control-N de mesure sur une ligne basse commune. Mode illustré avec état, sans secondaire ni commandes nommées. Hauteur et dessin conservés."}, room_compact: {label: Carte illustrée double hauteur (118 px), default: false, selector: {boolean: {}}, group: Pièce, group_icon: mdi:sofa-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (item.room_mode === 'illustrated') && (String(item.secondary || '').trim() === '')", description: "État et 1 à 3 commandes nommées type command, ou 1 à 2 mesures avec room_inline_metrics, sans secondaire. Cibles de 44 px à gauche de l’image de 80 px inchangée, titre sur une ligne. Dès 288 px de largeur. Sans configuration compatible, hauteur habituelle conservée."}, room_show_divider: {label: Afficher le trait au-dessus des commandes, default: true, selector: {boolean: {}}, group: Pièce, group_icon: mdi:sofa-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))", description: false masque seulement le séparateur décoratif ; positions et actions restent natives.}, room_hover: {label: Surbrillance au survol, default: true, selector: {boolean: {}}, group: Pièce, group_icon: mdi:sofa-outline, description: false masque la surbrillance du pointeur sur cette carte et ses sous-boutons. Les actions et le retour d’appui restent actifs.}, secondary_bold: {label: Interpréter **texte** en gras dans le texte secondaire, default: false, selector: {boolean: {}}, group: Valeurs et textes, group_icon: mdi:format-text, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (String(item.secondary || '').trim() !== '')"}, multiline: {label: Autoriser les textes sur plusieurs lignes, default: false, selector: {boolean: {}}, group: Valeurs et textes, group_icon: mdi:format-text, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, sub_button_styles: {label: Styles des sous-boutons (objet YAML), defau