ntent}, {label: Dans l’en-tête, value: header}]}}, group: Pièce, group_icon: mdi:sofa-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (item.room_mode !== 'illustrated') && (String(item.secondary || '').trim() === '' && (!card || card.show_state === false || (card.show_state !== true && card.button_type === 'name' && String(item.state || '').trim() === '')))"}, color_background: {label: Colorer aussi le fond (booléen ou template YAML), default: false, selector: {object: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, description: false par défaut. Saisir true/false ou un template Jinja entre guillemets., visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, icon_color: {label: Couleur personnalisée de l’icône, default: "", selector: {text: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, icon_opacity: {label: Opacité de l’icône (nombre ou template YAML), default: null, selector: {object: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, description: "Opacité native par défaut. Saisir de 0 à 1, null ou un template Jinja entre guillemets.", visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, border_color: {label: Couleur de la bordure de la carte, default: "", selector: {text: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, icon_border_color: {label: Couleur de la bordure du fond de l’icône, default: "", selector: {text: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, visible_if: "(!card || ((card.card_type || 'button') === 'button' && !