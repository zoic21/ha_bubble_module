name: Signature Room
version: 1.4.0
creator: Loïc
supported:
  - button
description: Module autonome room ; réglages en français, variables CSS du thème Signature et actions Bubble natives. Utiliser un seul module de présentation par carte.
editor:
  - type: constant
    label: L’entité principale, les actions et les sous-boutons se configurent dans les réglages natifs de Bubble.
  - name: ""
    label: Réglages room
    type: signature_options
    fields:
      room_mode:
        label: Présentation de la pièce
        default: classic
        selector:
          select:
            mode: dropdown
            options:
              - label: Classique
                value: classic
              - label: Illustrée
                value: illustrated
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
        description: "Illustrée : 148 px, nom et température, dessin à droite centré au-dessus des commandes ; humidité et icône principale masquées. Commandes et badges natifs conservés."
      illustration:
        label: Illustration de la pièce (objet YAML)
        default: {}
        selector:
          object: {}
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (item.room_mode === 'illustrated')
        description: "image : URL locale/HTTPS ; image_light/image_dark : variantes facultatives HA ; columns/rows : grille de sprites ; index : case à partir de 0, nombre ou Jinja ; offset_x/offset_y : nombre ou Jinja, cadrage en % de case de −50 à 50. Images à installer séparément."
      color:
        $field: color
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      secondary:
        $field: secondary
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      state:
        $field: state
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      room_state_as_value:
        label: État principal en grande valeur
        default: false
        selector:
          boolean: {}
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
        description: Valeur numérique et unité selon le rôle de mesure ; état textuel de 22 px. Ne modifie pas les actions natives.
      room_show_divider:
        label: Afficher le trait au-dessus des commandes
        default: true
        selector:
          boolean: {}
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
        description: false masque seulement le séparateur décoratif ; positions et actions restent natives.
      room_hover:
        label: Surbrillance au survol
        default: true
        selector:
          boolean: {}
        group: Pièce
        group_icon: mdi:sofa-outline
        description: false masque la surbrillance du pointeur sur cette carte et ses sous-boutons. Les actions et le retour d’appui restent actifs.
      secondary_bold:
        $field: secondary_bold
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (String(item.secondary || '').trim() !== '')
      multiline:
        $field: multiline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      sub_button_styles:
        $field: sub_button_styles
        description: "Objet indexé par classe CSS ou numéro natif. type: badge place un sous-bouton iconique après le nom. type: command empile icône et libellé d’une commande room-control-N illustrée ; active et disabled acceptent un booléen ou Jinja. Les commandes désactivées restent visibles et ne transmettent aucune action. color/background conservent leurs overrides."
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      room_auto_colors:
        label: Coloration automatique des commandes (booléen YAML)
        default: true
        selector:
          object: {}
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
        description: true par défaut ; false désactive les couleurs automatiques.
      room_control_columns:
        label: Colonnes de commandes
        default: 4
        selector:
          number:
            mode: box
            min: 1
            max: 6
            step: 1
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
        description: 4 colonnes par défaut, de 1 à 6.
      room_measures_position:
        label: Position des mesures
        default: content
        selector:
          select:
            mode: dropdown
            options:
              - label: Dans le contenu
                value: content
              - label: Dans l’en-tête
                value: header
        group: Pièce
        group_icon: mdi:sofa-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (item.room_mode !== 'illustrated') && (String(item.secondary || '').trim() === '' && (!card || card.show_state === false || (card.show_state !== true && card.button_type === 'name' && String(item.state || '').trim() === '')))
      color_background:
        $field: color_background
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      icon_color:
        $field: icon_color
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      icon_opacity:
        $field: icon_opacity
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      border_color:
        $field: border_color
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      icon_border_color:
        $field: icon_border_color
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
