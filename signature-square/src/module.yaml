name: Signature Square
version: 2.0.2
creator: Loïc
supported:
  - button
description: Module autonome square ; réglages en français, variables CSS du thème Signature et actions Bubble natives. Utiliser un seul module de présentation par carte.
editor:
  - type: constant
    label: L’entité principale, les actions et les sous-boutons se configurent dans les réglages natifs de Bubble.
  - name: ""
    label: Réglages square
    type: signature_options
    fields:
      color:
        $field: color
        visible_if: (!card || (card.card_type === 'media-player' && item.activity === true) || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      secondary:
        $field: secondary
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      state:
        $field: state
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      secondary_bold:
        $field: secondary_bold
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (String(item.secondary || '').trim() !== '')
      multiline:
        $field: multiline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      controls:
        label: Commandes
        default: native
        selector:
          select:
            mode: dropdown
            options:
              - label: Commandes natives
                value: native
              - label: Mesure (commande et détail)
                value: measure
        group: Commandes et sous-boutons
        group_icon: mdi:gesture-tap-button
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
        warn_text: "Numériques : bouton number/input_number en compacte. Mesure : tuile carrée avec les sous-boutons natifs."
      sub_button_styles:
        $field: sub_button_styles
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      auto_height:
        label: Adapter la hauteur au contenu
        default: false
        selector:
          boolean: {}
        group: Tuile carrée
        group_icon: mdi:card-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      reserve_measure_detail:
        label: Réserver la ligne de détail avec les commandes de mesure
        default: false
        selector:
          boolean: {}
        group: Tuile carrée
        group_icon: mdi:card-outline
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type))) && (item.controls === 'measure')
      illustration:
        label: Illustration décorative (objet YAML)
        default: {}
        selector:
          object: {}
        group: Tuile carrée
        group_icon: mdi:card-outline
        description: "image : URL de repli ; image_light/image_dark : variantes facultatives selon le thème HA ; columns/rows : grille de sprites ; index/index_dark : cases jour/nuit Square ; offset_y_dark : cadrage sombre facultatif ; index : case à partir de 0, nombre ou Jinja ; offset_x/offset_y : nombre ou Jinja, cadrage en % de case de −50 à 50. URLs locales/HTTPS ou Jinja. Images à installer séparément. Masquer l’icône dans Bubble pour éviter le doublon."
        visible_if: (!card || (card.card_type === 'media-player' && item.activity === true) || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      color_background:
        $field: color_background
        visible_if: (!card || (card.card_type === 'media-player' && item.activity === true) || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      icon_color:
        $field: icon_color
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      color_thresholds:
        $field: color_thresholds
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      icon_opacity:
        $field: icon_opacity
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      border_color:
        $field: border_color
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
      icon_border_color:
        $field: icon_border_color
        visible_if: (!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))
