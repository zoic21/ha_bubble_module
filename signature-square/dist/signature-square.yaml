signature_square:
 name: Signature Square
 version: 1.6.2
 creator: Loïc
 supported: [button, media-player]
 description: Module autonome square ; réglages en français, variables CSS du thème Signature et actions Bubble natives. Utiliser un seul module de présentation par carte.
