color:
  label: Couleur de l’icône
  default: blue
  selector:
    select:
      mode: dropdown
      custom_value: true
      options:
        - label: Bleu
          value: blue
        - label: Bleu clair
          value: light-blue
        - label: Turquoise
          value: teal
        - label: Cyan
          value: cyan
        - label: Vert
          value: green
        - label: Orange
          value: orange
        - label: Ambre
          value: amber
        - label: Jaune
          value: yellow
        - label: Rouge
          value: red
        - label: Rose
          value: pink
        - label: Indigo
          value: indigo
        - label: Violet
          value: purple
        - label: Gris
          value: grey
  description: Couleur de la palette, couleur CSS ou template Jinja.
secondary:
  label: Texte secondaire (entité, texte ou template)
  default: ""
  selector:
    text:
      multiline: true
state:
  label: Valeur principale personnalisée (texte ou template)
  default: ""
  selector:
    text:
      multiline: true
  group: Valeurs et textes
  group_icon: mdi:format-text
secondary_bold:
  label: Interpréter **texte** en gras dans le texte secondaire
  default: false
  selector:
    boolean: {}
  group: Valeurs et textes
  group_icon: mdi:format-text
multiline:
  label: Autoriser les textes sur plusieurs lignes
  default: false
  selector:
    boolean: {}
  group: Valeurs et textes
  group_icon: mdi:format-text
sub_button_styles:
  label: Styles des sous-boutons
  default: {}
  selector:
    object: {}
  group: Commandes et sous-boutons
  group_icon: mdi:gesture-tap-button
  description: Choisir un sous-bouton par son nom ou sa classe stable, puis configurer son style. Les actions restent dans Bubble.
  ui_kind: styles
color_background:
  label: Colorer aussi le fond
  default: false
  selector:
    object: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
  description: Valeur simple ou template Jinja ; Par défaut conserve le comportement existant.
  ui_kind: bool
icon_color:
  label: Couleur personnalisée de l’icône
  default: ""
  selector:
    text: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
  ui_kind: color
color_thresholds:
  label: Seuils de couleur de l’icône
  default: {}
  selector:
    object: {}
  group: Couleurs selon la valeur
  group_icon: mdi:palette-outline
  description: "values : liste value/color en #RGB, #RRGGBB ou rgb(r,g,b). Fond discret à 16 % suivant le thème ; icône à la couleur exacte du
    graphe, sans correction de contraste. Transition smooth par défaut ; enabled: false désactive."
  ui_kind: thresholds
icon_opacity:
  label: Opacité de l’icône
  default: null
  selector:
    object: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
  description: Opacité native par défaut. Saisir de 0 à 1, null ou un template Jinja entre guillemets.
  ui_kind: number
  ui_selector:
    number:
      min: 0
      max: 1
      step: 0.05
      mode: slider
icon_opacity_unavailable:
  label: Opacité de l’icône si l’entité est indisponible
  default: null
  selector:
    number:
      min: 0
      max: 1
      step: 0.05
      mode: box
  group: Apparence avancée
  group_icon: mdi:palette-outline
  description: "Facultatif, sans Jinja. Entité principale absente, unknown ou unavailable : cette opacité ; sinon icon_opacity ou 1. Null
    conserve le comportement natif. Les états texte et zéro restent disponibles."
border_color:
  label: Couleur de la bordure de la carte
  default: ""
  selector:
    text: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
  ui_kind: color
icon_border_color:
  label: Couleur de la bordure du fond de l’icône
  default: ""
  selector:
    text: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
  ui_kind: color
