# Shared field definitions, expanded only by the repository build.
color:
  label: Couleur de l’icône
  default: blue
  selector:
    select:
      mode: dropdown
      custom_value: true
      options:
        - label: Bleu
          value: blue
        - label: Bleu clair
          value: light-blue
        - label: Turquoise
          value: teal
        - label: Cyan
          value: cyan
        - label: Vert
          value: green
        - label: Orange
          value: orange
        - label: Ambre
          value: amber
        - label: Jaune
          value: yellow
        - label: Rouge
          value: red
        - label: Rose
          value: pink
        - label: Indigo
          value: indigo
        - label: Violet
          value: purple
        - label: Gris
          value: grey
  description: Couleur de la palette, couleur CSS ou template Jinja.
secondary:
  label: Texte secondaire (entité, texte ou template)
  default: ""
  selector:
    text:
      multiline: true
state:
  label: Valeur principale personnalisée (texte ou template)
  default: ""
  selector:
    text:
      multiline: true
  group: Valeurs et textes
  group_icon: mdi:format-text
secondary_bold:
  label: Interpréter **texte** en gras dans le texte secondaire
  default: false
  selector:
    boolean: {}
  group: Valeurs et textes
  group_icon: mdi:format-text
multiline:
  label: Autoriser les textes sur plusieurs lignes
  default: false
  selector:
    boolean: {}
  group: Valeurs et textes
  group_icon: mdi:format-text
sub_button_styles:
  label: Styles des sous-boutons (objet YAML)
  default: {}
  selector:
    object: {}
  group: Commandes et sous-boutons
  group_icon: mdi:gesture-tap-button
  description: Objet YAML indexé par css_class ou numéro de sous-bouton ; les clés personnalisées restent compatibles.
color_background:
  label: Colorer aussi le fond (booléen ou template YAML)
  default: false
  selector:
    object: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
  description: false par défaut. Saisir true/false ou un template Jinja entre guillemets.
icon_color:
  label: Couleur personnalisée de l’icône
  default: ""
  selector:
    text: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
color_thresholds:
  label: Seuils de couleur du fond de l’icône (objet YAML)
  default: {}
  selector:
    object: {}
  group: Couleurs selon la valeur
  group_icon: mdi:palette-outline
  description: "values : liste value/color en #RGB, #RRGGBB ou rgb(r,g,b). Fond du carré ; icône du thème avec protection de contraste. Transition smooth par défaut ; enabled: false désactive."
icon_opacity:
  label: Opacité de l’icône (nombre ou template YAML)
  default: null
  selector:
    object: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
  description: Opacité native par défaut. Saisir de 0 à 1, null ou un template Jinja entre guillemets.
border_color:
  label: Couleur de la bordure de la carte
  default: ""
  selector:
    text: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
icon_border_color:
  label: Couleur de la bordure du fond de l’icône
  default: ""
  selector:
    text: {}
  group: Apparence avancée
  group_icon: mdi:palette-outline
