name: Signature Header
version: 1.3.0
creator: Loïc
supported:
  - button
  - separator
description: Module autonome header ; réglages en français, variables CSS du thème Signature et actions Bubble natives. Utiliser un seul module de présentation par carte.
editor:
  - type: constant
    label: "Le type natif de carte choisit la présentation : bouton Nom pour l’en-tête, séparateur pour le titre de section. Actions et sous-boutons restent natifs."
  - name: ""
    label: Réglages header
    type: signature_options
    fields:
      color:
        $field: color
        visible_if: (!card || ((card.card_type || 'button') === 'button' && card.button_type === 'name'))
      align_section_columns:
        name: Aligner les colonnes de la section
        description: Pour une section native élargie, reprendre son écart de colonnes dans la vue. Partagé entre les titres, restauré au retrait du module.
        selector:
          boolean: {}
        visible_if: (!card || card.card_type === 'separator')
      minimum_card_width:
        name: Largeur minimale des demi-cartes
        description: Dans cette section native, repasser les demi-cartes sur une ligne entière lorsque deux cartes de cette largeur ne tiennent plus avec leur écart natif de 8 px.
        selector:
          number:
            min: 120
            max: 500
            step: 1
            unit_of_measurement: px
            mode: box
        visible_if: (!card || card.card_type === 'separator')
      masonry_sections:
        name: Sections indépendantes sur ordinateur
        description: Une seule activation par vue Sections suffit. Combler les espaces verticaux en conservant les largeurs natives ; mobile et mode édition inchangés.
        selector:
          boolean: {}
      sub_button_styles:
        $field: sub_button_styles
        visible_if: (!card || card.card_type === 'separator' || ((card.card_type || 'button') === 'button' && card.button_type === 'name'))
        description: Objet YAML indexé par css_class ou numéro ; color_thresholds colore le fond du badge et protège le contraste de l’icône. Disponible aussi dans les titres de section.
