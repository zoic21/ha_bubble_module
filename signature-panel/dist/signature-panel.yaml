signature_panel:
 name: Signature Panel
 version: 1.1.0
 creator: Loïc
 supported: [button, media-player]
 description: Carte illustrée pleine largeur, deux pas de hauteur, une à trois informations et commandes Bubble natives. Un seul module de présentation par carte.
 editor: [{type: constant, label: "Utiliser rows 2 et grid_options columns full / rows 2. Nom, entité, actions et sous-boutons restent dans les réglages Bubble natifs."}, {name: "", label: Réglages du panneau, type: signature_options, fields: {illustration: {label: Illustration (objet YAML), selector: {object: {}}, description: "image, image_light/image_dark, columns/rows, index/index_dark, offset_x/offset_y/offset_y_dark. URLs et cadrage acceptent Jinja. Le module ne déduit aucun état métier.", visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, information: {label: "Informations supplémentaires (liste YAML, deux au maximum)", selector: {object: {}}, description: "La première information utilise le nom/état natif et secondary. Chaque entrée ajoute entity, name, state, secondary, icon, color, tap_action et/ou statistics, secondary_statistics. Les valeurs et libellés acceptent Jinja.", visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, color: {label: Couleur de l’icône, default: blue, selector: {select: {mode: dropdown, custom_value: true, options: [{label: Bleu, value: blue}, {label: Bleu clair, value: light-blue}, {label: Turquoise, value: teal}, {label: Cyan, value: cyan}, {label: Vert, value: green}, {label: Orange, value: orange}, {label: Ambre, value: amber}, {label: Jaune, value: yellow}, {label: Rouge, value: red}, {label: Rose, value: pink}, {label: Indigo, value: indigo}, {label: Violet, value: purple}, {label: Gris, value: grey}]}}, description: "Couleur de la palette, couleur CSS ou template Jinja.", visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, state: {label: Valeur principale personnalisée (texte ou template), default: "", selector: {text: {multiline: true}}, group: Valeurs et textes, group_icon: mdi:format-text, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, secondary: {label: "Texte secondaire (entité, texte ou template)", default: "", selector: {text: {multiline: true}}, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, secondary_bold: {label: Interpréter **texte** en gras dans le texte secondaire, default: false, selector: {boolean: {}}, group: Valeurs et textes, group_icon: mdi:format-text, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, color_background: {label: Colorer aussi le fond (booléen ou template YAML), default: false, selector: {object: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, description: false par défaut. Saisir true/false ou un template Jinja entre guillemets., visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, border_color: {label: Couleur de la bordure de la carte, default: "", selector: {text: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, sub_button_styles: {label: Styles des sous-boutons (objet YAML), default: {}, selector: {object: {}}, group: Commandes et sous-boutons, group_icon: mdi:gesture-tap-button, description: "Styles des sous-boutons natifs, par classe ou numéro. type badge : pastille iconique neutre à côté du titre. type command : icône/libellé, cible 44 px, active/disabled en booléen ou Jinja. Trois commandes visibles au maximum.", visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, hover: {label: Surbrillance au survol, default: true, selector: {boolean: {}}, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, tap_action: {label: Action sur la valeur principale, selector: {ui_action: {}}, description: Remplace le clic more-info sur la valeur principale. L'action de la carte et les actions des informations supplémentaires restent indépendantes., visible_if: "(!card || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, progress: {label: Progression (objet YAML), selector: {object: {}}, description: "value : 0 à 100 ou Jinja ; color : accent facultatif. Sans valeur numérique, piste masquée.", visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}}}]
