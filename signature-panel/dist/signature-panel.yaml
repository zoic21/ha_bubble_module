: {text: {multiline: true}}, group: Valeurs et textes, group_icon: mdi:format-text, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, secondary: {label: "Texte secondaire (entité, texte ou template)", default: "", selector: {text: {multiline: true}}, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, secondary_bold: {label: Interpréter **texte** en gras dans le texte secondaire, default: false, selector: {boolean: {}}, group: Valeurs et textes, group_icon: mdi:format-text, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, color_background: {label: Colorer aussi le fond (booléen ou template YAML), default: false, selector: {object: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, description: false par défaut. Saisir true/false ou un template Jinja entre guillemets., visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, border_color: {label: Couleur de la bordure de la carte, default: "", selector: {text: {}}, group: Apparence avancée, group_icon: mdi:palette-outline, visible_if: "(!card || card.card_type === 'media-player' || ((card.card_type || 'button') === 'button' && !['switch','slider'].includes(card.button_type)))"}, sub_button_styles: {label: Styles des sous-boutons (objet YAML), default: {}, selector: {object: {}}, group: Commandes et sous-boutons, group_icon: mdi:gesture-tap-button, description: "Styles des sous-boutons natifs, par classe ou numéro. type command : icône/libellé, cible 44 px, active/disabled en booléen ou Jinja. Trois commandes visibles au maximum.", visible_if: "(!card || card.card_type === 'media-playe