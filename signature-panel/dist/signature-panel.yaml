signature_panel:
 name: Signature Panel
 version: 1.6.0
 creator: Loïc
 supported: [button, media-player]
 description: Carte illustrée pleine largeur, deux pas de hauteur, une à trois informations et commandes Bubble natives. Un seul module de présentation par carte.
