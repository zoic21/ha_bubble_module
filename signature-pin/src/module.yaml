name: Signature PIN
version: 1.1.0
creator: Loïc
supported:
  - button
  - select
  - cover
  - climate
  - media-player
  - separator
  - sub-buttons
description: Clavier PIN pour toute la carte par défaut, ou seulement certains sous-boutons, avec sélection des utilisateurs concernés. Vérification locale dans le navigateur. Bubble Card 3.4.3 ou plus récent.
editor:
  - type: constant
    label: Le code protège toute la carte par défaut. Vous pouvez limiter la protection à certains sous-boutons et à certains utilisateurs, par exemple le mode de la maison sur la tablette.
  - name: ""
    label: Protection de la carte
    type: signature_pin_scope_options
    fields:
      enabled:
        label: Activer la demande de code
        default: true
        selector:
          boolean: {}
      scope:
        label: Actions à protéger
        default: card
        selector:
          select:
            options:
              - value: card
                label: Toute la carte
              - value: sub_buttons
                label: Sous-boutons uniquement
      sub_buttons:
        label: Sous-boutons à protéger
        description: Liste vide = tous les sous-boutons. La sélection suit les numéros Bubble ; vérifiez-la si vous réorganisez les boutons. Les actions du fond et de l’icône principale restent directes dans ce mode.
        visible_if: item.scope === 'sub_buttons'
        selector:
          select:
            multiple: true
            custom_value: true
            options: []
      new_code:
        label: Nouveau code PIN
        description: Chiffres uniquement, puis cliquer sur Enregistrer ou Remplacer le code. Laisser vide conserve le code actuel. Seule son empreinte SHA-256 sera enregistrée ; le code ne pourra plus être affiché.
        selector:
          text:
            type: password
      users:
        label: Demander le code à ces utilisateurs
        description: Liste vide = tous les utilisateurs. Les comptes non sélectionnés gardent leurs actions directes. La liste utilise les identifiants HA, pas les personnes ou leurs présences.
        selector:
          select:
            multiple: true
            custom_value: true
            options: []
