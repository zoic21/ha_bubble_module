# Generated by npm run build:modules. Edit src files, then regenerate.
alert_manager:
  name: Alert Manager
  version: 3.6.1
  creator: Loïc
  supported:
    - button
    - cover
    - climate
    - media-player
  description: "Affiche une pastille rouge pour une alerte active ou orange en attente, avec priorité aux couleurs personnalisées. color_badge: false utilise une pastille neutre (noire sans thème). La couleur de la carte reste inchangée par défaut ; color_card: true active sa coloration. L’icône principale et son fond restent inchangés. icons.active/pending et colors.active/pending suivent la priorité pack de l’entité, entité, pack, général. Capteurs sources, packs, exclusions et ignore_pending restent configurables. show_badge: false masque les pastilles pour toute la carte."
  editor:
    - type: constant
      label: Réglages de cette carte uniquement. Les seuils et délais restent dans l’intégration Alert Manager. Les règles personnalisées sont suivies automatiquement ; les packs s’activent ci-dessous.
    - name: ""
      type: signature_module_options
      label: Réglages du module
      fields:
        show_badge:
          label: Afficher la pastille d’alerte
          default: true
          selector:
            boolean: {}
          group: Affichage et filtrage
          group_icon: mdi:alert-circle-outline
          visible_if: "!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))"
        color_badge:
          label: Colorer la pastille
          default: true
          selector:
            boolean: {}
          visible_if: (!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))) && (item.show_badge !== false)
          group: Affichage et filtrage
          group_icon: mdi:alert-circle-outline
        color_card:
          label: Colorer le fond de la carte
          default: false
          selector:
            boolean: {}
          group: Affichage et filtrage
          group_icon: mdi:alert-circle-outline
          visible_if: "!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))"
        ignore_pending:
          label: Masquer les alertes en attente
          default: false
          selector:
            boolean: {}
          group: Affichage et filtrage
          group_icon: mdi:alert-circle-outline
          visible_if: "!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))"
        colors:
          label: Couleurs générales
          fields: &a1
            active:
              label: Couleur des alertes actives
              description: "Vide : hériter de la couleur du niveau supérieur, puis du rouge du thème."
              selector:
                text: {}
            pending:
              label: Couleur des alertes en attente
              description: "Vide : hériter de la couleur du niveau supérieur, puis de l’orange du thème."
              selector:
                text: {}
          empty_undefined: true
          group: Couleurs et icônes
          group_icon: mdi:palette-outline
          visible_if: "!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))"
        icons:
          label: Icônes générales
          fields: &a2
            active:
              label: Icône des alertes actives
              description: "Vide : hériter, puis mdi:exclamation."
              selector:
                icon: {}
            pending:
              label: Icône des alertes en attente
              description: "Vide : hériter, puis mdi:clock-outline."
              selector:
                icon: {}
          empty_undefined: true
          visible_if: (!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))) && (item.show_badge !== false)
          group: Couleurs et icônes
          group_icon: mdi:palette-outline
        sensors:
          label: Capteurs sources
          fields:
            active:
              label: Capteur des alertes actives
              description: "Vide : sensor.alert_manager_main_active."
              selector:
                entity:
                  filter:
                    domain: sensor
            pending:
              label: Capteur des alertes en attente
              description: "Vide : sensor.alert_manager_main_pending."
              selector:
                entity:
                  filter:
                    domain: sensor
          empty_undefined: true
          group: Sources des alertes
          group_icon: mdi:database-outline
          visible_if: "!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))"
        packs:
          label: Packs activés
          fields: &a6
            ignore_pending: &a3
              label: Masquer les alertes en attente
              default: auto
              selector:
                select:
                  options:
                    - value: auto
                      label: Hériter du réglage général
                    - value: "false"
                      label: Non
                    - value: "true"
                      label: Oui
                  mode: dropdown
              boolean_choice: true
            colors: &a4
              label: Couleurs
              fields: *a1
              empty_undefined: true
              group: Couleurs
              group_icon: mdi:palette-outline
            icons: &a5
              label: Icônes
              fields: *a2
              empty_undefined: true
              group: Icônes
              group_icon: mdi:alert-circle-outline
          empty_undefined: true
          mapping: packs
          key_field:
            label: Identifiant du pack
            description: Chaque entrée active le pack. Supprimer l’entrée pour le désactiver.
            selector:
              text: {}
            required: true
          group: Packs activés
          group_icon: mdi:package-variant
          visible_if: "!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))"
        entities:
          label: Exceptions et entités supplémentaires
          fields:
            exclude:
              label: Exclusions
              fields:
                mode:
                  label: Exclure
                  default: none
                  selector:
                    select:
                      options:
                        - value: none
                          label: Aucune exclusion
                        - value: all
                          label: Toute l’entité
                        - value: rules
                          label: Certaines règles ou certains packs
                      mode: dropdown
                rules:
                  label: Identifiants des règles ou packs exclus
                  description: Saisir les identifiants exacts. Une liste vide n’exclut rien.
                  selector:
                    select:
                      options: []
                      multiple: true
                      custom_value: true
                  visible_if: item.mode === 'rules'
              empty_undefined: true
              exclusion: true
            ignore_pending: *a3
            colors: *a4
            icons: *a5
            packs:
              label: Packs activés
              fields: *a6
              empty_undefined: true
              mapping: packs
              key_field:
                label: Identifiant du pack
                description: Chaque entrée active le pack. Supprimer l’entrée pour le désactiver.
                selector:
                  text: {}
                required: true
              group: Packs de l’entité
              group_icon: mdi:package-variant
          empty_undefined: true
          mapping: entities
          key_field:
            label: Entité
            description: Une entrée ajoute l’entité au suivi ou remplace ses réglages. Supprimer l’entrée restaure le suivi automatique.
            selector:
              entity: {}
            required: true
          group: Exceptions par entité
          group_icon: mdi:tune
          visible_if: "!card || (card.button_type !== 'slider' && ['button','cover','climate','media-player'].includes(card.card_type || 'button'))"
