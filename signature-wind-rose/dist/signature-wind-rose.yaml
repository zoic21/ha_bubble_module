signature_wind_rose:
  name: Signature Wind Rose
  version: 1.0.0
  creator: Loïc
  supported:
    - button
  description: A minimal, time-weighted wind rose with 1 hour, 1 day and 1 week periods. Requires Bubble Card 3.3 or later and recorded wind direction states.
  code: |-
    [data-signature-wind-rose] {
      --swr-surface: var(--signature-card-background,var(--ha-card-background,var(--card-background-color,#fff)));
      --swr-accent: var(--signature-wind-rose-color,#4db6ac);
      --swr-divider: var(--signature-divider-color,color-mix(in srgb,var(--primary-text-color) 8%,transparent));
