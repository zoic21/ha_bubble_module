signature_wind_rose:
 name: Signature Wind Rose
 version: 1.5.0
 creator: Loïc
 supported: [button]
 description: A time-weighted wind rose with speed bands, historical sector details and 1 hour, 1 day and 1 week periods. Requires Bubble Card 3.3 or later and recorded wind direction states.
