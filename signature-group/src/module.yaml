name: Signature Group
version: 1.1.5
creator: Loïc
supported:
  - button
  - pop-up
description: Résume les cartes visibles d’une popup Bubble. Ajouter le module aux deux cartes et activer background_update sur la popup source. Conditions et cartes restent définies une seule fois dans la popup ; actions et présentation restent natives.
editor:
  - type: constant
    label: "Popup : ajouter les cartes et leurs conditions natives, puis activer l’actualisation en arrière-plan. Bouton Nom : configurer une action native de navigation vers cette popup."
  - name: popup
    label: Identifiant de la popup (facultatif)
    selector:
      text: {}
    description: "Par défaut, reprend le hash de la popup ou la destination de l’action native du bouton. Exemple : #activites."
    visible_if: (!card || card.card_type !== 'pop-up')
  - name: max_names
    label: Nombre de noms dans le résumé classique
    default: 2
    selector:
      number:
        min: 0
        max: 5
        step: 1
        mode: box
    description: Sans effet sur les pastilles, dont le nombre dépend de la largeur disponible.
    visible_if: (!card || card.card_type !== 'pop-up')
  - name: presentation
    label: Présentation du bouton
    default: summary
    selector:
      select:
        options:
          - label: Titre, résumé et compteur
            value: summary
          - label: Pastilles illustrées adaptatives
            value: chips
    description: Les pastilles reprennent les noms et illustrations des cartes de la popup. Le +N compte uniquement les éléments masqués ; la flèche reste à droite.
    visible_if: (!card || card.card_type !== 'pop-up')
  - name: hide_empty
    label: Masquer le bouton sans activité
    default: false
    selector:
      boolean: {}
    description: Conserve le bouton en mode édition et signale une source manquante au lieu de la confondre avec une liste vide.
    visible_if: (!card || card.card_type !== 'pop-up')
