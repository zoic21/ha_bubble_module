# Replace these example IDs with your weather and local station entities.
type: custom:bubble-card
card_type: button
button_type: state
entity: weather.home
show_name: false
show_state: false
show_icon: false
button_action:
  tap_action:
    action: none
grid_options:
  columns: full
  rows: auto
modules:
  - signature_weather
signature_weather:
  layout: summary
  name: À la maison
  forecast_type: daily
  count: 6
  current_precision: 1
  current_metrics:
    - humidity
    - wind_speed
    - precipitation
    - uv_index
  local:
    temperature: sensor.outdoor_temperature
    humidity: sensor.outdoor_humidity
    wind_speed: sensor.wind_speed
    precipitation: sensor.rain_today
    uv_index: sensor.uv_index
