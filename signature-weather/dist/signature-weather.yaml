      height: auto !important;
      min-height: 0 !important;
      padding: 0 !important;
      border-radius: var(--signature-card-border-radius,22px) !important;
      background: var(--sw-surface) !important;
      border: 1px solid var(--signature-card-border-color,color-mix(in srgb,var(--primary-text-color) 5%,transparent)) !important;
      box-shadow: var(--signature-card-box-shadow,0 2px 10px rgb(0 0 0 / .035)) !important;
      overflow: hidden;
    }
    [data-signature-weather] .bubble-container > .bubble-wrapper { display: none !important; }
    [data-signature-weather] .sw-canvas { width: 100%; color: var(--primary-text-color); font-size: 14px; line-height: 1.3; }
    [data-signature-weather] .sw-canvas * { box-sizing: border-box; }
    [data-signature-weather] .sw-canvas [hidden] { display: none !important; }
    [data-signature-weather] .sw-canvas button {
      appearance: none; border: 0; padding: 0; margin: 0;
      background: transparent; color: inherit; font: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    [data-signature-weather] .sw-canvas button:focus-visible { outline: 2px solid var(--sw-rain); outline-offset: -2px; border-radius: 8px; }
    [data-signature-weather] .sw-current { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 18px 16px 12px; }
    [data-signature-weather] .sw-current-icon { --mdc-icon-size: 32px; }
    [data-signature-weather] .sw-name { font-size: var(--signature-name-font-size,14px); font-weight: var(--signature-font-weight-semibold, 600); letter-spacing: -.2px; overflow-wrap: anywhere; }
    [data-signature-weather] .sw-condition { font-size: var(--signature-secondary-font-size,13px); color: var(--secondary-text-color); margin-top: 3px; overflow-wrap: anywhere; }
