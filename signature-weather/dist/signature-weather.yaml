  code: |-
    [data-signature-weather] {
      --sw-surface: var(--signature-card-background,var(--ha-card-background,var(--card-background-color,#fff)));
      --sw-divider: var(--signature-divider-color,color-mix(in srgb,var(--primary-text-color) 8%,transparent));
      --sw-track: var(--signature-control-background,color-mix(in srgb,var(--primary-text-color) 5%,var(--sw-surface)));
      --sw-sun: var(--weather-icon-sun-color,#e7ad14);
      --sw-cloud: var(--weather-icon-cloud-back-color,#8c959d);
      --sw-rain: var(--weather-icon-rain-color,#269bbd);
      --sw-cool: var(--signature-weather-cool-color,#8bc3d2);
      --sw-warm: var(--signature-weather-warm-color,#e9ac70);
      border: 0 !important;
      box-shadow: none !important;
      font-family: var(--signature-font-family, -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif);
      container-type: inline-size;
    }
    [data-signature-weather] .card-content { padding: 0 !important; height: auto !important; }
    [data-signature-weather] .bubble-container {
      display: block !important;
      height: auto !important;
      min-height: 0 !important;
      padding: 0 !important;
      border-radius: var(--signature-card-border-radius,22px) !important;
      background: var(--sw-surface) !important;
      border: 1px solid var(--signature-card-border-color,color-mix(in srgb,var(--primary-text-color) 5%,transparent)) !important;
      box-shadow: var(--signature-card-box-shadow,var(--ha-card-box-shadow,0 2px 10px rgb(0 0 0 / .035))) !important;
      overflow: hidden;
    }
    [data-signature-weather] .bubble-container > .bubble-wrapper { display: none !important; }
    [data-signature-weather] .sw-canvas { width: 100%; color: var(--primary-text-color); font-size: var(--signature-name-font-size,14px); font-weight: var(--signature-font-weight-normal,400); line-height: 1.3; }
    [data-signature-weather] .sw-canvas * { box-sizing: border-box; }
    [data-signature-weather] .sw-canvas [hidden] { display: none !important; }
    [data-signature-weather] .sw-canvas button {
      appearance: none; border: 0; padding: 0; margin: 0;
      background: transparent; color: inherit; font: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    [data-signature-weather] .sw-canvas button:focus-visible { outline: 2px solid var(--sw-rain); outline-offset: -2px; }
    [data-signature-weather] .sw-current { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 18px 16px 12px; }
    [data-signature-weather] .sw-current-icon { --mdc-icon-size: 32px; }
    [data-signature-weather] .sw-name { font-size: var(--signature-name-font-size,14px); font-weight: var(--signature-font-weight-semibold, 600); letter-spacing: -.2px; overflow-wrap: anywhere; }
    [data-signature-weather] .sw-condition { font-size: var(--signature-secondary-font-size,13px); color: var(--secondary-text-color); margin-top: 3px; overflow-wrap: anywhere; }
    [data-signature-weather] .sw-current-temperature { display: inline-flex; align-items: baseline; gap: 3px; font-size: var(--signature-temperature-font-size,30px) !important; font-weight: var(--signature-font-weight-medium, 500) !important; letter-spacing: -.7px; white-space: nowrap; }
    [data-signature-weather] .sw-current-unit { color: var(--secondary-text-color); font-size: var(--signature-temperature-unit-font-size,13px); font-weight: var(--signature-font-weight-normal, 400); letter-spacing: 0; }
    [data-signature-weather] .sw-current-metrics { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 16px 12px; }
    [data-signature-weather] .sw-metric { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; font-size: var(--signature-caption-font-size,12px) !important; color: var(--secondary-text-color) !important; }
    /* Keep numeric figures after the canvas button font reset. */
    [data-signature-weather] .sw-canvas :is(.sw-current-temperature,.sw-metric) { font-variant-numeric: tabular-nums; }
    [data-signature-weather] .sw-metric ha-icon { --mdc-icon-size: 16px; }
    [data-signature-weather] .sw-toolbar { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 12px 16px 0; }
    [data-signature-weather] .sw-current:not([hidden]) + .sw-current-metrics + .sw-toolbar { border-top: 1px solid transparent; }
    [data-signature-weather] .sw-current:not([hidden]) + .sw-current-metrics + .sw-toolbar::before,
    [data-signature-weather] .sw-canvas[data-layout="ranges"] .sw-entry + .sw-entry::before,
    [data-signature-weather] .sw-detail::before {
      content: ''; position: absolute; top: -1px; inset-inline: var(--signature-divider-inset,16px);
      height: 1px; background: var(--sw-divider); pointer-events: none;
    }
    [data-signature-weather] .sw-tabs { display: inline-flex; gap: 3px; border-radius: var(--signature-control-border-radius,14px); background: var(--sw-track); padding: 3px; }
    [data-signature-weather] .sw-canvas .sw-tab { padding: 0 10px !important; min-height: var(--signature-control-height,40px); font-size: var(--signature-secondary-font-size,13px) !important; border-radius: max(0px,calc(var(--signature-control-border-radius,14px) - 3px)); color: var(--secondary-text-color); }
    [data-signature-weather] .sw-tab[aria-pressed="true"] { color: var(--primary-text-color); background: var(--sw-surface); box-shadow: var(--signature-control-box-shadow,0 1px 4px rgb(0 0 0 / .06)); }
    [data-signature-weather] .sw-forecast { display: flex; padding: 18px 12px; overflow-x: auto; }
    [data-signature-weather] .sw-entry { position: relative; flex: 1 0 48px; display: flex; flex-direction: column; align-items: center; gap: 9px; min-height: 125px; padding: 0 1px 8px !important; }
    [data-signature-weather] .sw-entry[aria-pressed="true"]::after { content: ''; position: absolute; bottom: 0; width: 14px; height: 2px; border-radius: 2px; background: var(--sw-cloud); }
    [data-signature-weather] .sw-entry-label { font-size: var(--signature-caption-font-size,12px); color: var(--secondary-text-color); white-space: pre-line; text-align: center; }
    [data-signature-weather] .sw-entry-icon { --mdc-icon-size: 28px; margin: 2px 0; }
    [data-signature-weather] .sw-high { font-size: 20px; font-weight: var(--signature-font-weight-medium, 500); letter-spacing: -.3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    [data-signature-weather] .sw-low { font-size: var(--signature-secondary-font-size,13px); color: var(--secondary-text-color); white-space: nowrap; font-variant-numeric: tabular-nums; }
    [data-signature-weather] .sw-range { display: none; }
    [data-signature-weather] .sw-canvas[data-layout="ranges"] .sw-forecast { --sw-forecast-inset: 16px; display: block; padding: 6px var(--sw-forecast-inset); overflow: visible; }
    [data-signature-weather] .sw-canvas[data-layout="ranges"] .sw-entry { display: grid; grid-template-columns: 58px 26px 42px minmax(20px,1fr) 48px; gap: 10px; width: 100%; min-height: 56px; padding: 0 !important; text-align: left; }
    [data-signature-weather] .sw-canvas[data-layout="ranges"] .sw-entry::after { display: none; }
    [data-signature-weather] .sw-canvas[data-layout="ranges"] .sw-entry + .sw-entry { border-top: 1px solid transparent; }
