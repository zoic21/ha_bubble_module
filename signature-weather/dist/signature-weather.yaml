    [data-signature-weather] .sw-canvas[data-layout="ranges"] .sw-entry::after { display: none; }
    [data-signature-weather] .sw-canvas[data-layout="ranges"] .sw-entry + .sw-entry { border-top: 1px solid transparent; }
