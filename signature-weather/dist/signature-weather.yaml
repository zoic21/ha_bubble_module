      label: Réglages du module
      fields:
        layout:
          label: Présentation
          default: ribbon
          selector:
            select:
              options:
                - value: ribbon
                  label: Ruban de prévisions
                - value: ranges
                  label: Plages de température
                - value: summary
                  label: Résumé météo
              mode: dropdown
          visible_if: "!card || ((card.card_type || 'button') === 'button' && card.button_type !== 'slider')"
        entity:
          label: Entité météo
          description: "Vide : utiliser l’entité de la carte."
          selector:
            entity:
              filter:
                domain: weather
          group: Prévisions
          group_icon: mdi:weather-partly-cloudy
          visible_if: "!card || ((card.card_type || 'button') === 'button' && card.button_type !== 'slider')"
        forecast_type:
          label: Type de prévision
          default: auto
          selector:
            select:
              options:
                - value: auto
                  label: Automatique
                - value: daily
                  label: Journalière
                - value: hourly
                  label: Horaire
                - value: twice_daily
                  label: Jour / nuit
              mode: dropdown
          auto_choice: true
          description: "Automatique : premier type pris en charge. Un choix explicite reste conservé même si le fournisseur ne le propose pas."
          group: Prévisions
          group_icon: mdi:weather-partly-cloudy
          visible_if: "!card || ((card.card_type || 'button') === 'button' && card.button_type !== 'slider')"
        count:
          label: Nombre de prévisions
          description: "Par défaut : 6."
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: box
          group: Prévisions
          group_icon: mdi:weather-partly-cloudy
          visible_if: "!card || ((card.card_type || 'button') === 'button' && card.button_type !== 'slider')"
        precision:
          label: Décimales des prévisions
          description: "Par défaut : 0."
          selector:
