      --sw-rain: var(--weather-icon-rain-color,#269bbd);
      --sw-cool: var(--signature-weather-cool-color,#8bc3d2);
      --sw-warm: var(--signature-weather-warm-color,#e9ac70);
      border: 0 !important;
      box-shadow: none !important;
      font-family: var(--signature-font-family, -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif);
