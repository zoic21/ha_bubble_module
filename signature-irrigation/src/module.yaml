name: Signature Irrigation
version: 1.1.0
creator: Loïc
supported:
  - button
description: Prochain départ et historique OpenSprinkler depuis l’API calendrier HA, en complément de Signature Compact. Lecture et cache
  partagés par connexion/calendrier, aucune commande d’arrosage ni nouvelle entité.
editor:
  - name: ""
    label: Arrosage
    type: signature_guided_v1
    fields:
      role:
        label: Rôle de la carte
        selector:
          select:
            options:
              - label: Prochain départ
                value: next
              - label: Tableau d’historique
                value: history
              - label: État sans historique
                value: empty
              - label: Commandes des jours
                value: weekdays
      calendar:
        label: Calendrier
        selector:
          entity:
            domain: calendar
        visible_if: item.role !== "weekdays"
      stations:
        label: Noms des stations
        selector:
          object: {}
        description: Liste des noms/alias du calendrier, sans distinction de casse.
        visible_if: item.role !== "weekdays"
        ui_kind: strings
      popup:
        label: Hash de la popup active
        selector:
          text: {}
        visible_if: item.role !== "weekdays"
      logging_entity:
        label: Entité portant la journalisation
        selector:
          entity: {}
        visible_if: item.role !== "weekdays"
        group: Journalisation (avancé)
      logging_attribute:
        label: Attribut de journalisation
        selector:
          text: {}
        description: "Défaut : logging_enabled."
        visible_if: item.role !== "weekdays" && !!item.logging_entity
        group: Journalisation (avancé)
