      action: navigate
      navigation_path: /dashboard-rdc/summary
  - name: Jardin
    icon: mdi:tree
    show_name: false
    show_background: false
    tap_action:
      action: navigate
      navigation_path: /dashboard-exterieure/summary
  - name: Sécurité
    icon: mdi:security
    show_name: false
    show_background: false
    tap_action:
      action: navigate
      navigation_path: /dashboard-securite/summary
  - name: Informatique
    icon: mdi:server
    show_name: false
