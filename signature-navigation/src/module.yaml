name: Signature Navigation
version: 1.0.7
creator: Loïc
supported:
  - sub-buttons
description: Floating navigation footer with Signature corners, directional glass highlights and automatic active-dashboard selection. Native sub-buttons keep their icons, visibility and actions. Requires Bubble Card 3.4.1 or later.
editor:
  - type: constant
    label: Utiliser un footer avec une rangée de sous-boutons en bas. Icônes et destinations se règlent dans les options natives de Bubble.
  - name: mobile_margin
    label: Marge de chaque côté sur mobile
    default: 24
    selector:
      number:
        min: 0
        max: 48
        step: 1
        unit_of_measurement: px
        mode: slider
  - name: blur
    label: Flou du verre
    default: 18
    selector:
      number:
        min: 0
        max: 32
        step: 1
        unit_of_measurement: px
        mode: slider
  - name: opacity
    label: Opacité du fond
    default: 45
    selector:
      number:
        min: 0
        max: 100
        step: 1
        unit_of_measurement: "%"
        mode: slider
